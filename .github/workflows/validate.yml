name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate theme files
        run: node scripts/validate-theme.mjs

      - name: Require Chrome for checkbox checks
        run: command -v google-chrome

      - name: Test alternate checkboxes
        run: node scripts/test-alternate-checkboxes.mjs
